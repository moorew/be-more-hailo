<p>Samples the artwork paths below into morph-compatible contours (same point count,
top edge then bottom edge) and builds <code>shapes.json</code>. To add or redraw a mouth, paste
its SVG path into <code>MOUTHS</code> in this file, open it in a browser, and copy the
downloaded file to <code>bmo_face/</code> and <code>static/face/</code>.</p>

<pre id="log"></pre>

// left anchor -> right anchor, the "bottom" chain runs back. Line-only mouths
// (strokes like the smile) get a degenerate contour whose top and bottom chains
// coincide, so they stroke as a line but can still morph into open shapes.

// Eyes are stored relative to the eye centre (left eye; the rig mirrors for the right).
const EYES = {
  open:   { outline: 'M-37.5 0A37.5 43 0 1 0 37.5 0A37.5 43 0 1 0 -37.5 0Z', stroke: 0 },
  closed: { line: 'M-39 10Q0 30 39 10', stroke: 12 },                      // blink lid, a soft ‿
  happy:  { line: 'M-46 20C-34 -30 34 -30 46 20', stroke: 15 },            // ∩ squint
  relax:  { line: 'M-64.5 -41C-41 64.7 42.7 69.2 64.5 -41', stroke: 15 },  // Rosto-04 ◡
  wide:   { outline: 'M-47 0A47 55 0 1 0 47 0A47 55 0 1 0 -47 0Z', stroke: 0 },
};

const svg = document.getElementById('svg');
const logEl = document.getElementById('log');
const log = (s) => (logEl.textContent += s + '\n');

function densePoints(d, n = 3000) {
  const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  p.setAttribute('d', d);
  svg.appendChild(p);
  const L = p.getTotalLength();
  const pts = [];
  for (let i = 0; i <= n; i++) {
    const q = p.getPointAtLength((L * i) / n);
    pts.push([q.x, q.y]);
  }
  svg.removeChild(p);
  return pts;
}

function resample(chain, count) {
  // Uniform arc-length resample of a polyline to `count` points (endpoints kept).
  const cum = [0];
  for (let i = 1; i < chain.length; i++) {
    cum.push(cum[i - 1] + Math.hypot(chain[i][0] - chain[i - 1][0], chain[i][1] - chain[i - 1][1]));
  }
  const total = cum[cum.length - 1];
  const out = [];
  let j = 0;
  for (let k = 0; k < count; k++) {
    const s = count === 1 ? 0 : (total * k) / (count - 1);
    while (j < chain.length - 2 && cum[j + 1] < s) j++;
    const seg = cum[j + 1] - cum[j] || 1;
    const t = Math.min(1, Math.max(0, (s - cum[j]) / seg));
    out.push([chain[j][0] + (chain[j + 1][0] - chain[j][0]) * t, chain[j][1] + (chain[j + 1][1] - chain[j][1]) * t]);
  }
  return out;
}

function contourFromLine(d, N) {
  let chain = densePoints(d);
  if (chain[0][0] > chain[chain.length - 1][0]) chain = chain.reverse();
  const top = resample(chain, N / 2 + 1);
  const bottom = top.slice(1, -1).reverse();
  return top.concat(bottom);
}

function contourFromOutline(d, N) {
  let loop = densePoints(d);
  loop.pop(); // closing duplicate
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (const [x, y] of loop) { minX = Math.min(minX, x); maxX = Math.max(maxX, x); minY = Math.min(minY, y); maxY = Math.max(maxY, y); }
  const midY = (minY + maxY) / 2;
  const nearest = (tx, ty) => {
    let best = 0, bd = Infinity;
    loop.forEach(([x, y], i) => { const dd = (x - tx) ** 2 + (y - ty) ** 2; if (dd < bd) { bd = dd; best = i; } });
    return best;
  };
  const iL = nearest(minX, midY), iR = nearest(maxX, midY);
  const walk = (a, b) => { const out = []; for (let i = a; ; i = (i + 1) % loop.length) { out.push(loop[i]); if (i === b) break; } return out; };
  const arc1 = walk(iL, iR), arc2 = walk(iR, iL);
  const meanY = (c) => c.reduce((s, p) => s + p[1], 0) / c.length;
  let top, bottom;
  if (meanY(arc1) < meanY(arc2)) { top = arc1; bottom = arc2; }        // arc1 runs L->R already
  else { top = arc2.slice().reverse(); bottom = arc1.slice().reverse(); }
  const topS = resample(top, N / 2 + 1);
  const botS = resample(bottom, N / 2 + 1).slice(1, -1);
  return topS.concat(botS);
}

const round2 = (pts, dx = 0, dy = 0) => pts.map(([x, y]) => [+(x + dx).toFixed(2), +(y + dy).toFixed(2)]);

function buildMouth(def) {
  const dx = def.dx || 0, dy = def.dy || 0;
  const outer = round2(def.line ? contourFromLine(def.line, MOUTH_N) : contourFromOutline(def.outline, MOUTH_N), dx, dy);
  const ys = outer.map((p) => p[1]);
  const top = Math.min(...ys), bottom = Math.max(...ys);
  const bottomMid = outer[MOUTH_N / 2 + (MOUTH_N / 2) / 2]; // middle of the bottom chain
  const tongue = def.tongue
    ? round2(contourFromOutline(def.tongue, TONGUE_N), dx, dy)
    : Array.from({ length: TONGUE_N }, () => [bottomMid[0], +(bottomMid[1] + 4).toFixed(2)]);
  return {
    outer,
    stroke: def.stroke,
    // No upper teeth -> line sits above the mouth, so its band is empty.
    teethTop: def.teethTop != null ? def.teethTop + dy : +(top - 4).toFixed(2),
    teethBot: def.teethBot != null ? def.teethBot + dy : +(bottom + 4).toFixed(2),
    tongue,
    hasTongue: !!def.tongue,
  };
}

function buildEye(def) {
  return { pts: round2(def.line ? contourFromLine(def.line, EYE_N) : contourFromOutline(def.outline, EYE_N)), stroke: def.stroke };
}

const shapes = {
  version: 1,
  art: { width: 1280, height: 720 },
  colors: { bg: '#C9E4C3', line: '#000000', cavity: '#396337', tongue: '#A2B36A', teeth: '#FFFFFF', blush: '#548B51' },
  eyeCenters: [[333.5, 271], [945.5, 271]],
  mouthOrder: Object.keys(MOUTHS),
  mouths: Object.fromEntries(Object.entries(MOUTHS).map(([k, v]) => [k, buildMouth(v)])),
  eyeOrder: Object.keys(EYES),
  eyes: Object.fromEntries(Object.entries(EYES).map(([k, v]) => [k, buildEye(v)])),
};

// Preview every contour so we can eyeball anchor placement.
const ctx = document.getElementById('c').getContext('2d');
const names = shapes.mouthOrder;
names.forEach((name, i) => {
  const m = shapes.mouths[name];
  const col = i % 5, row = Math.floor(i / 5);
  ctx.save();
  ctx.translate(col * 256 + 128, row * 240 + 120);
  ctx.scale(0.6, 0.6);
  ctx.translate(-640, -480);
  ctx.beginPath();
  m.outer.forEach(([x, y], k) => (k ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
  ctx.closePath();
  ctx.fillStyle = '#396337'; ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = '#000'; ctx.stroke();
  ctx.fillStyle = 'red'; ctx.beginPath(); ctx.arc(m.outer[0][0], m.outer[0][1], 6, 0, 7); ctx.fill();
  ctx.fillStyle = 'blue'; ctx.beginPath(); ctx.arc(m.outer[MOUTH_N / 2][0], m.outer[MOUTH_N / 2][1], 6, 0, 7); ctx.fill();
  ctx.fillStyle = '#000'; ctx.font = '22px sans-serif'; ctx.fillText(name, 560, 380);
  ctx.restore();
});

const json = JSON.stringify(shapes);
// Save: a download link always works; the PUTs only succeed on the dev server.
const a = document.createElement('a');
a.href = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
a.download = 'shapes.json';
a.textContent = `Download shapes.json (${json.length} bytes) - copy it to bmo_face/ and static/face/`;
a.style.cssText = 'color:#9fe0c8;font-size:15px;display:block;margin:8px 0';
document.body.insertBefore(a, document.getElementById('c'));
Promise.all([
  fetch('/web/shapes.json', { method: 'PUT', body: json }),
  fetch('/python/bmo_face/shapes.json', { method: 'PUT', body: json }),
]).then((rs) => log('dev server save: ' + rs.map((r) => r.status).join(', ')))
  .catch(() => {});
log(names.map((n) => `${n}: top=${shapes.mouths[n].teethTop} bot=${shapes.mouths[n].teethBot} stroke=${shapes.mouths[n].stroke}`).join('\n'));
</script>
